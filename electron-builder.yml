appId: com.successabovedreams.chopcore
productName: ChopCore
copyright: Copyright © 2025 Success Above Dreams

directories:
  output: dist-electron

files:
  - dist/**/*
  - electron/**/*
  - resources/**/*
  - backend/dist/chopcore-api
  - backend/alembic/**/*
  - backend/alembic.ini
  - scripts/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icons/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
